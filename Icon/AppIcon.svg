<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B45D6"/>
      <stop offset="1" stop-color="#1B1450"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#D9DEEA"/>
      <stop offset="1" stop-color="#9AA3BA"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE2EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.6" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B0828" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <ellipse cx="275" cy="878" rx="130" ry="18" fill="#0B0828" opacity="0.35"/>

    <g filter="url(#sh)">
      <!-- Cmd+C keycap -->
      <g transform="translate(275 265) rotate(-12)">
        <rect x="-78" y="-62" width="156" height="124" rx="24" fill="#AEB6CC"/>
        <rect x="-78" y="-68" width="156" height="116" rx="24" fill="url(#key)"/>
        <text x="0" y="12" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="64" fill="#2B2463" text-anchor="middle">⌘C</text>
      </g>
      <!-- Ctrl+C keycap -->
      <g transform="translate(500 195) rotate(8)">
        <rect x="-118" y="-52" width="236" height="104" rx="22" fill="#AEB6CC"/>
        <rect x="-118" y="-58" width="236" height="96" rx="22" fill="url(#key)"/>
        <text x="0" y="5" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="50" fill="#2B2463" text-anchor="middle">Ctrl+C</text>
      </g>
    </g>

    <g transform="translate(0 45)">
    <!-- speed lines -->
    <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="9" stroke-linecap="round">
      <line x1="860" y1="160" x2="905" y2="140"/>
      <line x1="880" y1="420" x2="915" y2="425"/>
      <line x1="610" y1="140" x2="650" y2="125"/>
    </g>

    <!-- items still flying in (behind the net) -->
    <g filter="url(#sh)">
      <!-- letter A -->
      <text x="780" y="250" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="150" fill="#FFD447" transform="rotate(-16 780 250)" text-anchor="middle">A</text>
      <!-- image card -->
      <g transform="translate(830 345) rotate(14) scale(1.25)">
        <rect x="-62" y="-48" width="124" height="96" rx="14" fill="#FFFFFF"/>
        <rect x="-50" y="-36" width="100" height="72" rx="6" fill="#7FD3F7"/>
        <circle cx="22" cy="-14" r="11" fill="#FFD447"/>
        <path d="M -50 36 L -14 -6 L 10 18 L 26 4 L 50 30 L 50 36 Z" fill="#2E9E6A"/>
      </g>
      <!-- letters E and B -->
      <text x="815" y="720" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="120" fill="#FF4757" transform="rotate(-14 815 720)" text-anchor="middle">E</text>
      <text x="420" y="390" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="78" fill="#5CB8FF" transform="rotate(12 420 390)" text-anchor="middle">B</text>
      <!-- letter c -->
      <text x="860" y="520" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="96" fill="#7CF2C1" transform="rotate(20 860 520)" text-anchor="middle">c</text>
    </g>

    <!-- items already caught (inside the bag) -->
    <g filter="url(#sh)">
      <!-- PDF page -->
      <g transform="translate(690 575) rotate(-18) scale(1.05)">
        <path d="M -44 -58 H 22 L 46 -34 V 58 H -44 Z" fill="#FFFFFF"/>
        <path d="M 22 -58 V -34 H 46 Z" fill="#D0D5E2"/>
        <rect x="-44" y="-6" width="90" height="32" rx="4" fill="#E5484D"/>
        <text x="1" y="18" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle">PDF</text>
        <rect x="-32" y="-44" width="44" height="7" rx="3" fill="#C3C9D8"/>
        <rect x="-32" y="-28" width="60" height="7" rx="3" fill="#C3C9D8"/>
        <rect x="-32" y="36" width="54" height="7" rx="3" fill="#C3C9D8"/>
      </g>
      <!-- a whole word -->
      <text x="655" y="500" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="72" fill="#FF8A65" transform="rotate(-20 655 500)" text-anchor="middle">word</text>
    </g>

    <!-- big butterfly net -->
    <g filter="url(#sh)">
      <line x1="376" y1="494" x2="497" y2="465" stroke="#E5383B" stroke-width="16" stroke-linecap="round"/>
      <g transform="translate(625 400) rotate(-32) scale(1.75)">
        <path d="M -78 0 Q -60 120 10 150 Q 60 120 78 0 Z" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3"/>
        <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" fill="none">
          <path d="M -40 2 Q -30 100 10 150"/>
          <path d="M 0 2 Q 4 90 10 150"/>
          <path d="M 40 2 Q 40 100 10 150"/>
          <path d="M -72 40 Q 0 62 74 40"/>
          <path d="M -62 82 Q 4 104 66 82"/>
          <path d="M -36 122 Q 8 136 46 122"/>
        </g>
        <ellipse cx="0" cy="0" rx="80" ry="24" fill="none" stroke="#C9CFDD" stroke-width="7"/>
      </g>
    </g>

    <!-- "Catch" riding on the rim of the net -->
    <text x="592" y="338" font-family="'Big Caslon', 'Libre Caslon Display', serif" font-weight="500" font-size="84" fill="#FFFFFF" stroke="#2B2463" stroke-width="7" paint-order="stroke" transform="rotate(-32 592 338)" text-anchor="middle" filter="url(#sh)">Catch</text>

    </g>

    <!-- smaller paperclip figure, bottom left -->
    <g transform="translate(3 323) scale(0.68)">
      <g filter="url(#sh)" stroke="url(#steel)" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <g transform="translate(455 525) rotate(18)">
          <path d="M 12 -44 V 62 A 15 15 0 0 1 -18 62 V -78 A 24 24 0 0 1 30 -78 V 84 A 32 32 0 0 1 -34 84 V -40" stroke-width="15"/>
        </g>
        <path d="M 448 430 L 505 370 L 548 318" stroke-width="22"/>
        <path d="M 432 438 L 370 470 L 318 448" stroke-width="22"/>
        <path d="M 430 625 L 528 612 L 520 712" stroke-width="24"/>
        <path d="M 420 628 L 352 712 L 268 770" stroke-width="24"/>
      </g>
      <circle cx="410" cy="378" r="44" fill="url(#steel)" filter="url(#sh)"/>
    </g>
  </g>
</svg>
